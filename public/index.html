<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>node skeleton</title>

    <!-- tailwind cdn -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <h1 class="bg-red-200 p-2 text-lg">node skeleton app</h1>
    <div id="users"></div>

    <script src="./app.js"></script>

    <script type="module">
      import { getUsers } from "./js/users.js";

      async function main() {
        const users = await getUsers();

        console.log(users);
        if (!users) return;

        const usersDiv = document.querySelector("#users");

        if (!usersDiv) return;

        usersDiv.innerHTML = ""; // clear old users

        for (const user of users) {
          const div = document.createElement("div");
          div.textContent = user.name || user.email || "Unknown";

          usersDiv.appendChild(div);
        }
      }

      main();
    </script>
  </body>
</html>
